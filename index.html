<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ROCK PAPER SCISSOR GAME</h1>
    <br>
    <br>
    <div class="choices">
        <div class="choice" id="paper">
            <img src="paper1.png">
        </div>
         <div class="choice" id="rock">
            <img src="rock.png">
        </div>
         <div class="choice" id="scissors">
            <img src="scissors.png">
        </div>
    </div>
    <br>
    <br>
    <div class="scoreboard">
        <div  class="score">
            <p>You</p>
            <p id="user-score">0</p>
        </div>
        <div class="score" >
            <p>Computer</p>
            <p id="comp-score">0</p>
        </div>
    </div>
    <br>
    <br>
    <div id="message">
        <p>
            PLAY
        </p>
    </div>
    <script src="./script.js"></script>
</body>
</html>
